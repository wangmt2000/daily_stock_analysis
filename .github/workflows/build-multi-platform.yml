# ===================================
# 多架构 Docker 镜像构建和推送工作流
# ===================================
# 支持架构：amd64, arm64, arm/v7
# 触发条件：push to main 分支

name: Build Multi-Platform Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/build-multi-platform.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台（逗号分隔）'
        required: false
        default: 'linux/amd64,linux/arm64,linux/arm/v7'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. 设置 QEMU（用于模拟其他架构）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: linux/amd64,linux/arm64,linux/arm/v7
      
      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: |
            image=moby/buildkit:latest
            network=host
      
      # 4. 登录 GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # 5. 提取元数据
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      # 6. 构建并推送镜像
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          # 支持多架构构建
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # 推送到 registry
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存优化
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # 7. 生成构建报告
      - name: Generate build report
        if: always()
        run: |
          echo "## 🐳 Docker 镜像构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像地址**" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**支持架构**" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm/v7" >> $GITHUB_STEP_SUMMARY

  # 可选：验证镜像
  verify:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Verify image tags
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker inspect ghcr.io/${{ github.repository }}:latest | grep -i architecture || true
